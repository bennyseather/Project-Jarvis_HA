project:
  name: "Project Jarvis"
  version: "0.45.30"

system:
  debug: false

logging:
  level: INFO

storage:
  database_path: "data/jarvis.sqlite3"

home_assistant:
  url: "http://homeassistant.local:8123"
  token: ""
  all_entities: true
  allowed_read_entities: []
  allowed_read_domains: []
  excluded_entities: []
  entity_aliases: {}
  area_aliases: {}
  action_policy:
    all_entities: true
    all_device_services: true
    confirm_required: []
    high_impact: []
    allowed_entities: []
    allowed_domains: []
    excluded_entities: []

conversation:
  context_messages: 20
  maximum_conversations: 20
  retention_days: 3
  maximum_messages_per_conversation: 100

episodic_memory:
  enabled: true
  retention_days: 30
  maximum_episodes: 50
  minimum_messages: 6
  context_limit: 3

research:
  enabled: true
  automatic: true
  search_context_size: "medium"
  maximum_sources: 5
  timeout_seconds: 45
  allowed_domains: []

hybrid_research:
  searxng_url: "http://homeassistant.local:8088/search"
  search_engines: "bing,duckduckgo,brave"
  maximum_results: 5
  maximum_pages: 3
  maximum_page_bytes: 262144
  timeout_seconds: 15
  normal_model: "gpt-5.6-luna"
  escalation_model: "gpt-5.6-terra"
  premium_model: "gpt-5.6-sol"

current_information:
  total_timeout_seconds: 3.0
  search_timeout_seconds: 2.2
  synthesis_timeout_seconds: 0.7
  cache_ttl_seconds: 300
  maximum_sources: 3
  maximum_evidence_characters: 4500
  time_zone: "Europe/Oslo"

responsive_voice:
  progress_deadline_seconds: 1.0
  maximum_runtime_seconds: 90.0
  maximum_pending_jobs: 16

efficient_intelligence:
  enabled: true
  stable_cache_ttl_seconds: 600
  maximum_cache_entries: 128
  maximum_concurrent_reasoning: 2
  maximum_context_references: 24
  telemetry_entries: 200

ai_budget:
  monthly_limit_usd: 10.0
  warning_thresholds: [0.7, 0.9]
  hard_limit: true

local_reasoning:
  enabled: true
  url: "http://192.168.1.105:10550"
  model: "qwen3:8b"
  voice_model: "qwen3:8b"
  embedding_model: "qwen3-embedding:0.6b"
  timeout_seconds: 90
  fallback_to_openai: true
  token: ""
  context_tokens: 4096
  maximum_input_messages: 8
  maximum_input_characters: 12000
  maximum_output_tokens: 240
  failure_cooldown_seconds: 30

reflection:
  context_limit: 5

proactive:
  enabled: true
  minimum_confidence: 0.8
  maximum_pending: 10
  expiry_hours: 24
  cooldown_minutes: 60
  snooze_minutes: 120
  quiet_start: "22:00"
  quiet_end: "07:00"
  notification_enabled: true
  voice_enabled: false
  scan_interval_seconds: 300
  low_battery_threshold: 20
  routine_repeat_threshold: 3

situational_intelligence:
  enabled: true
  maximum_entities: 2000
  maximum_details: 10
  maximum_timeline_results: 20
  low_battery_threshold: 20

compound_orchestration:
  enabled: true
  maximum_actions: 10
  confirmation_ttl_seconds: 60

stewardship:
  enabled: true
  require_confirmation: false
  reconciliation_seconds: 300
  maximum_targets: 100
  confirmation_ttl_seconds: 300
  manual_override_minutes: 30
  audit_limit: 100

rss:
  enabled: true
  cache_path: "/share/jarvis_rss/stories.json"
  maximum_spoken_stories: 5

adaptive_learning:
  enabled: true
  evidence_threshold: 3
  minimum_confidence: 0.75
  stale_after_days: 90
  confirmation_ttl_seconds: 300
  maximum_preferences: 100
  audit_limit: 200
  routine_evidence_threshold: 5

routine_learning:
  enabled: true
  evidence_threshold: 3
  sequence_window_minutes: 10
  stale_after_days: 45
  maximum_events: 500
  maximum_routines: 100
  audit_limit: 200

persona:
  name: "Jarvis"
  dry_wit: true
  humour: "subtle"
  warmth: "balanced"
  formality: "refined"
  verbosity: "concise"
  proactivity: "balanced"
  preferred_address: ""

event_timeline:
  enabled: true
  allowed_event_types:
    - state_changed
  allowed_entities: []
  max_events: 500
