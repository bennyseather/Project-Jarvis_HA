project:
  name: "Project Jarvis"
  version: "0.13.2"

system:
  debug: false

logging:
  level: INFO

storage:
  database_path: "data/jarvis.sqlite3"

home_assistant:
  url: "http://homeassistant.local:8123"
  token: ""
  all_entities: true
  allowed_read_entities: []
  allowed_read_domains: []
  excluded_entities: []
  entity_aliases: {}
  action_policy:
    all_entities: true
    all_device_services: true
    confirm_required: []
    high_impact: []
    allowed_entities: []
    allowed_domains: []
    excluded_entities: []

conversation:
  context_messages: 20
  maximum_conversations: 20
  retention_days: 3
  maximum_messages_per_conversation: 100

reflection:
  context_limit: 5

proactive:
  enabled: true
  minimum_confidence: 0.8
  maximum_pending: 10
  expiry_hours: 24
  cooldown_minutes: 60
  snooze_minutes: 120
  quiet_start: "22:00"
  quiet_end: "07:00"
  notification_enabled: true
  voice_enabled: false
  scan_interval_seconds: 300
  low_battery_threshold: 20
  routine_repeat_threshold: 3

situational_intelligence:
  enabled: true
  maximum_entities: 500
  maximum_details: 10
  maximum_timeline_results: 20
  low_battery_threshold: 20

persona:
  name: "Jarvis"
  dry_wit: true

event_timeline:
  enabled: true
  allowed_event_types:
    - state_changed
  allowed_entities: []
  max_events: 500
