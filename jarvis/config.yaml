name: "Project Jarvis"
version: "0.35.3"
slug: "jarvis"
description: "Project Jarvis Home Assistant companion"
arch: [amd64, aarch64]
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
map:
  - addon_config:rw
  - homeassistant_config:rw
options:
  openai_api_key: ""
  bridge_api_key: ""
  proactive_voice_enabled: false
  searxng_url: "http://homeassistant.local:8088/search"
  monthly_ai_budget_usd: 10.0
  episodic_memory_enabled: true
  episodic_retention_days: 30
  maximum_episodes: 50
  personality_humour: "subtle"
  personality_warmth: "balanced"
  personality_formality: "refined"
  personality_verbosity: "concise"
  personality_proactivity: "balanced"
  preferred_address: ""
  stewardship_enabled: true
  stewardship_reconciliation_seconds: 300
  adaptive_learning_enabled: true
schema:
  openai_api_key: password
  bridge_api_key: password
  proactive_voice_enabled: bool
  searxng_url: str
  monthly_ai_budget_usd: float
  episodic_memory_enabled: bool
  episodic_retention_days: int(1,365)
  maximum_episodes: int(1,200)
  personality_humour: list(off|subtle|moderate)
  personality_warmth: list(reserved|balanced|warm)
  personality_formality: list(relaxed|refined)
  personality_verbosity: list(concise|balanced|detailed)
  personality_proactivity: list(reactive|balanced|proactive)
  preferred_address: str?
  stewardship_enabled: bool
  stewardship_reconciliation_seconds: int(30,3600)
  adaptive_learning_enabled: bool
