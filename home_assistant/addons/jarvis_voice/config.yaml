name: "Project Jarvis Voice"
version: "0.34.3"
slug: "jarvis_voice"
description: "High-quality local streaming Jarvis neural voice"
arch: [amd64]
startup: services
boot: auto
init: false
map:
  - share:ro
ports:
  10350/tcp: 10350
ports_description:
  10350/tcp: "Jarvis Wyoming TTS (normally internal only)"
options:
  engine: "qwen_1_7b"
  qwen_host: "127.0.0.1"
  qwen_port: 10400
  qwen_filter: "clean"
  qwen_filter_strength: 0.55
  qwen_connect_timeout: 3.0
  qwen_maximum_spoken_characters: 420
  qwen_buffer_before_playback: true
  qwen_maximum_buffer_megabytes: 64
  model_package: "/share/jarvis_voice/jarvis-piper-m40.zip"
  model_cache_dir: "/data/models/m40"
  piper_noise_scale: 0.35
  piper_noise_w: 0.45
  clarity_mode: true
  upstream_host: "core-piper"
  upstream_port: 10200
  profile: "jarvis_v5"
  strength: 1.0
  output_gain: 0.98
  voice: "bm_george"
  speed: 1.08
  shorten_comma_pauses: true
  pitch_factor: 1.035
  staccato_pause_ms: 25.0
  darkness: 0.12
  articulation_mode: "crisp"
  maximum_segment_characters: 105
  voice_revision: 9
  piper_fallback: true
  reference_path: "/app/jarvis-reference.wav"
  generation_timeout: 300.0
  warm_model: true
schema:
  engine: list(qwen_1_7b|piper_m40|piper_m39|chatterbox_nano|kokoro)
  qwen_host: str
  qwen_port: port
  qwen_filter: list(clean|refined|synthesized|synthetic|metallic)
  qwen_filter_strength: float(0.0,1.0)
  qwen_connect_timeout: float(1.0,30.0)
  qwen_maximum_spoken_characters: int(120,1000)
  qwen_buffer_before_playback: bool
  qwen_maximum_buffer_megabytes: int(1,256)
  model_package: str
  model_cache_dir: str
  piper_noise_scale: float(0.0,1.0)
  piper_noise_w: float(0.0,1.0)
  clarity_mode: bool
  upstream_host: str
  upstream_port: port
  profile: list(jarvis_v5|refined|synthesized|synthetic|metallic|clean)
  strength: float(0.0,1.0)
  output_gain: float(0.25,1.5)
  voice: list(bm_george|bm_fable|bm_daniel|bm_lewis)
  speed: float(0.75,1.25)
  shorten_comma_pauses: bool
  pitch_factor: float(1.0,1.2)
  staccato_pause_ms: float(0.0,250.0)
  darkness: float(0.0,0.25)
  articulation_mode: list(crisp|balanced)
  maximum_segment_characters: int(60,180)
  voice_revision: int(0,9)
  piper_fallback: bool
  reference_path: str
  generation_timeout: float(5.0,600.0)
  warm_model: bool
