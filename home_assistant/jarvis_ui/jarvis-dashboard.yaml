title: Jarvis Command Center
views:
  - title: Command
    path: command
    icon: jarvis:core
    type: sections
    theme: Jarvis Command Center
    sections:
      - type: grid
        cards:
          - type: custom:jarvis-markup-card
            title: Good day, Benny
            content: Home systems are ready. Select Ask Jarvis to begin.
            icon: jarvis:core
            layout: wide
          - type: custom:jarvis-voice-card
            title: Ask Jarvis
            description: Open Project Jarvis and start listening
            pipeline_id: preferred
            start_listening: true
          - type: custom:jarvis-voice-satellite-card
            title: Windows Voice Satellite
            pipeline_id: preferred
            wake_word_phrase: Hey Jarvis
            wake_timeout: 15
      - type: grid
        cards:
          - type: custom:jarvis-status-card
            name: Whole-home status
            entities:
              - sun.sun
              - light.interior_lights
              - light.blocks
              - camera.porch_camera
              - media_player.loftstue_group
          - type: custom:jarvis-presence-card
            entity: person.benny
            name: Benny
          - type: custom:jarvis-light-card
            entity: light.interior_lights
            name: Interior lights
      - type: grid
        cards:
          - type: custom:jarvis-camera-card
            entity: camera.porch_camera
            name: Porch camera
          - type: custom:jarvis-light-card
            entity: light.outside_porch_1
            name: Porch 1
            layout: compact
          - type: custom:jarvis-light-card
            entity: light.outside_porch_2
            name: Porch 2
            layout: compact
      - type: grid
        cards:
          - type: custom:jarvis-spotify-card
            entity: media_player.loftstue_group
            name: Loftstue Group

  - title: Rooms
    path: rooms
    icon: jarvis:room
    type: sections
    theme: Jarvis Command Center
    sections:
      - type: grid
        cards:
          - type: custom:jarvis-room-card
            name: Upstairs office
            icon: jarvis:room
            navigation_path: /jarvis-command-center/upstairs-office
            temperature_entity: sensor.upstairs_office_temperature
            entities:
              - light.blocks
              - light.upstairs_office_lights
              - light.upstairs_office_u7_pro_xg_basement_led
              - climate.mill_heater_upstairs_office
          - type: custom:jarvis-room-card
            name: Living room
            icon: jarvis:room
            navigation_path: /jarvis-command-center/living-room
            entities:
              - light.light_living_room_namron_light
              - light.spot_liquor_cabinet
              - light.tv_area_wall_1
              - light.tv_area_wall_2
              - media_player.loftstue_group
          - type: custom:jarvis-room-card
            name: Exterior
            icon: jarvis:outdoor-light
            navigation_path: /jarvis-command-center/exterior
            entities:
              - light.outside_porch_1
              - light.outside_porch_2
              - camera.porch_camera

  - title: Upstairs office
    path: upstairs-office
    subview: true
    icon: jarvis:room
    type: sections
    theme: Jarvis Command Center
    sections:
      - type: grid
        cards:
          - type: custom:jarvis-markup-card
            title: Upstairs office
            content: Lighting, climate, and room telemetry.
            icon: jarvis:room
          - type: custom:jarvis-light-card
            entity: light.blocks
            name: Blocks
          - type: custom:jarvis-light-card
            entity: light.upstairs_office_lights
            name: Office lights
          - type: custom:jarvis-light-card
            entity: light.upstairs_office_u7_pro_xg_basement_led
            name: Network LED
          - type: custom:jarvis-climate-card
            entity: climate.mill_heater_upstairs_office
            name: Office heater
          - type: custom:jarvis-sensor-card
            entity: sensor.upstairs_office_temperature
            name: Office temperature

  - title: Living room
    path: living-room
    subview: true
    icon: jarvis:room
    type: sections
    theme: Jarvis Command Center
    sections:
      - type: grid
        cards:
          - type: custom:jarvis-markup-card
            title: Living room
            content: Lighting and entertainment controls.
            icon: jarvis:room
          - type: custom:jarvis-light-card
            entity: light.light_living_room_namron_light
          - type: custom:jarvis-light-card
            entity: light.spot_liquor_cabinet
          - type: custom:jarvis-light-card
            entity: light.tv_area_wall_1
          - type: custom:jarvis-light-card
            entity: light.tv_area_wall_2
          - type: custom:jarvis-spotify-card
            entity: media_player.loftstue_group

  - title: Exterior
    path: exterior
    subview: true
    icon: jarvis:outdoor-light
    type: sections
    theme: Jarvis Command Center
    sections:
      - type: grid
        cards:
          - type: custom:jarvis-camera-card
            entity: camera.porch_camera
          - type: custom:jarvis-light-card
            entity: light.outside_porch_1
          - type: custom:jarvis-light-card
            entity: light.outside_porch_2
          - type: custom:jarvis-lock-card
            entity: lock.front_door

  - title: Environment
    path: environment
    icon: jarvis:climate
    type: sections
    theme: Jarvis Command Center
    sections:
      - type: grid
        cards:
          - type: custom:jarvis-weather-card
            entity: weather.forecast_home
            name: Home weather
          - type: custom:jarvis-climate-card
            entity: climate.mill_heater_upstairs_office
            name: Upstairs office
          - type: custom:jarvis-energy-card
            entity: sensor.home_energy
            name: Home energy
          - type: custom:jarvis-ev-charger-card
            entity: switch.ev_charger
            power_entity: sensor.ev_charger_power
            name: EV charger

  - title: Media & Voice
    path: media-voice
    icon: jarvis:speaker
    type: sections
    theme: Jarvis Command Center
    sections:
      - type: grid
        cards:
          - type: custom:jarvis-voice-card
            title: Speak with Jarvis
            description: Use the preferred Assist pipeline
            pipeline_id: preferred
            start_listening: true
          - type: custom:jarvis-spotify-card
            entity: media_player.loftstue_group
            name: Loftstue Group
          - type: custom:jarvis-camera-card
            entity: camera.porch_camera

  - title: Jarvis
    path: jarvis
    icon: jarvis:core
    type: sections
    theme: Jarvis Command Center
    sections:
      - type: grid
        cards:
          - type: custom:jarvis-markup-card
            title: Project Jarvis
            content: >-
              Jarvis provides conversation, contextual understanding, durable
              memory, home knowledge, and orchestration. Home Assistant owns
              entities, devices, permissions, automations, and state.
            icon: jarvis:core
          - type: custom:jarvis-voice-card
            title: Ask Jarvis
            description: Start a conversation
            pipeline_id: preferred
            start_listening: true
            compact: true
      - type: grid
        cards:
          - type: custom:jarvis-action-card
            label: Project Jarvis add-on
            description: Open add-on status and logs
            icon: jarvis:core
            accent: amber
            tap_action:
              action: navigate
              navigation_path: /hassio/addon/85a88fc0_jarvis/info
          - type: custom:jarvis-action-card
            label: Conversation integration
            description: Open the Project Jarvis integration
            icon: jarvis:automation
            tap_action:
              action: navigate
              navigation_path: /config/integrations/integration/jarvis_conversation
          - type: custom:jarvis-action-card
            label: Component catalog
            description: Browse all Jarvis cards and icons
            icon: jarvis:button
            tap_action:
              action: navigate
              navigation_path: /jarvis-components/components
