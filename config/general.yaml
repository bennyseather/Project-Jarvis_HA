project:
  name: "Project Jarvis"
  version: "0.1.0"

system:
  debug: false

logging:
  level: INFO

home_assistant:
  url: "http://homeassistant.local:8123"
  token: ""
  allowed_read_entities:
    - light.blocks
  entity_aliases: {}
  action_policy:
    confirm_required:
      - light.turn_on
      - light.turn_off
    high_impact: []
    allowed_entities:
      - light.blocks

conversation:
  max_messages: 12

event_timeline:
  enabled: true
  allowed_event_types:
    - state_changed
  allowed_entities:
    - light.blocks
  max_events: 50
