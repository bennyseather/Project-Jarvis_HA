project:
  name: "Project Jarvis"
  version: "0.1.0"

system:
  debug: false

logging:
  level: INFO

storage:
  database_path: "data/jarvis.sqlite3"

home_assistant:
  url: "http://homeassistant.local:8123"
  token: ""
  all_entities: true
  allowed_read_entities: []
  allowed_read_domains: []
  excluded_entities: []
  entity_aliases: {}
  action_policy:
    all_entities: true
    all_device_services: true
    confirm_required: []
    high_impact: []
    allowed_entities: []
    allowed_domains: []
    excluded_entities: []

conversation:
  max_messages: 12

event_timeline:
  enabled: true
  allowed_event_types:
    - state_changed
  allowed_entities: []
  max_events: 50
