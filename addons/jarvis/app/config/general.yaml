project:
  name: "Project Jarvis"
  version: "0.1.0"

system:
  debug: false

logging:
  level: INFO

storage:
  database_path: "data/jarvis.sqlite3"

home_assistant:
  url: "http://homeassistant.local:8123"
  token: ""
  allowed_read_entities:
    - light.blocks
  allowed_read_domains: [light, switch]
  excluded_entities: [camera.porch_camera]
  entity_aliases: {}
  action_policy:
    confirm_required:
      - light.turn_on
      - light.turn_off
    high_impact: []
    allowed_entities:
      - light.blocks
    allowed_domains: [light, switch]
    excluded_entities: []

conversation:
  max_messages: 12

event_timeline:
  enabled: true
  allowed_event_types:
    - state_changed
  allowed_entities:
    - light.blocks
  max_events: 50
