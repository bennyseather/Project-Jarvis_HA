title: Jarvis Component Catalog
views:
  - title: Components
    path: components
    icon: jarvis:core
    type: sections
    theme: Jarvis Command Center
    badges:
      - type: custom:jarvis-entity-badge
        entity: sun.sun
        name: Daylight
      - type: custom:jarvis-shortcut-badge
        label: Ask Jarvis
        icon: jarvis:core
        tap_action:
          action: assist
          pipeline_id: preferred
          start_listening: true
      - type: custom:jarvis-progress-badge
        entity: sensor.example_progress
        name: Progress
        min: 0
        max: 100
      - type: custom:jarvis-presence-badge
        entity: person.benny
        name: Benny
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Jarvis controls
            icon: jarvis:core
          - type: custom:jarvis-voice-card
            title: Ask Jarvis
            description: Voice interface ready
            pipeline_id: preferred
            start_listening: true
          - type: custom:jarvis-voice-satellite-card
            title: Windows Voice Satellite
            pipeline_id: preferred
            wake_word_phrase: Hey Jarvis
            wake_timeout: 15
          - type: custom:jarvis-button-card
            label: Command Button
            description: Tap, hold and double-tap actions
            icon: jarvis:button
            tap_action:
              action: none
          - type: custom:jarvis-entity-card
            entity: sun.sun
            name: Daylight telemetry
          - type: custom:jarvis-light-card
            entity: light.blocks
            name: Blocks
          - type: custom:jarvis-switch-card
            entity: switch.example_switch
            name: Switch-style example
          - type: custom:jarvis-slider-card
            entity: light.blocks
            name: Variable control
            min: 0
            max: 100
          - type: custom:jarvis-climate-card
            entity: climate.mill_heater_upstairs_office
          - type: custom:jarvis-cover-card
            entity: cover.example_cover
          - type: custom:jarvis-media-card
            entity: media_player.loftstue_group
          - type: custom:jarvis-camera-card
            entity: camera.porch_camera
          - type: custom:jarvis-sensor-card
            entity: sun.sun
          - type: custom:jarvis-status-card
            name: Accepted test entities
            entities:
              - light.blocks
              - camera.porch_camera
              - media_player.loftstue_group
          - type: custom:jarvis-room-card
            name: Example room
            entities:
              - light.blocks
              - media_player.loftstue_group
          - type: custom:jarvis-presence-card
            entity: person.benny
          - type: custom:jarvis-weather-card
            entity: weather.forecast_home
          - type: custom:jarvis-energy-card
            entity: sensor.home_energy
          - type: custom:jarvis-fan-card
            entity: fan.example_fan
          - type: custom:jarvis-vacuum-card
            entity: vacuum.example_vacuum
          - type: custom:jarvis-lock-card
            entity: lock.front_door
          - type: custom:jarvis-alarm-card
            entity: alarm_control_panel.home
          - type: custom:jarvis-scene-card
            entity: scene.example_scene
          - type: custom:jarvis-timer-card
            entity: timer.example_timer
          - type: custom:jarvis-mower-card
            entity: lawn_mower.example_mower
          - type: custom:jarvis-washer-card
            entity: sensor.washing_machine
            remaining_entity: sensor.washing_machine_minutes_remaining
            total_cycle_minutes: 120
          - type: custom:jarvis-spotify-card
            entity: media_player.loftstue_group
          - type: custom:jarvis-ev-charger-card
            entity: switch.ev_charger
            power_entity: sensor.ev_charger_power
          - type: custom:jarvis-tile-card
            entity: sun.sun
          - type: custom:jarvis-markup-card
            title: Information panel
            content: Editable Jarvis markup content.
          - type: custom:jarvis-car-card
            name: Vehicle
            location_entity: device_tracker.car
            battery_entity: sensor.car_battery
            range_entity: sensor.car_range
            odometer_entity: sensor.car_odometer
            charging_entity: binary_sensor.car_charging
            lock_entity: lock.car
          - type: custom:jarvis-calendar-card
            name: Household agenda
            entities:
              - calendar.example
          - type: custom:jarvis-month-calendar-card
            name: Household month
            entities:
              - calendar.example
          - type: custom:jarvis-glance-card
            name: At a glance
            entities:
              - light.blocks
              - media_player.loftstue_group
          - type: custom:jarvis-alerts-card
            name: Home alerts
            entities:
              - binary_sensor.example_leak
          - type: custom:jarvis-network-card
            name: Network and NAS
            entities:
              - sensor.example_storage
          - type: custom:jarvis-climate-overview-card
            name: Climate overview
            entities:
              - climate.mill_heater_upstairs_office
          - type: custom:jarvis-perimeter-card
            name: Security perimeter
            entities:
              - lock.front_door
          - type: custom:jarvis-energy-flow-card
            name: Energy flow
            entities:
              - sensor.home_energy
      - type: grid
        cards:
          - type: heading
            heading: Icon system
            icon: jarvis:core
          - type: custom:jarvis-icon-catalog-card
          - type: custom:jarvis-coverage-card
